[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workbook_forge"
version = "0.1.0"
description = "A versioned Excel formula glossary and bounded evaluator"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=9", "jsonschema>=4.26", "packaging>=24"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.data-files]
"share/workbook_forge/catalog" = [
  "catalog/formulas.json",
  "catalog/open_source_patterns.json",
  "catalog/open-source-patterns.schema.json",
  "catalog/function-inventory.schema.json",
  "catalog/formula-support.schema.json",
  "catalog/function_inventory.json",
]

[tool.setuptools.packages.find]
where = ["python"]
# Ship only the library. Namespace discovery would also package python/tests.
include = ["workbook_forge*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]

[tool.ruff]
line-length = 100
target-version = "py312"
