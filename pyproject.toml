[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "workbook_forge"
version = "0.2.0"
description = "Agent-ready Excel SDK with an independent Python workbook engine"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.txt"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=9.1.1", "jsonschema>=4.26.0", "packaging>=26.3", "setuptools>=84.0.0", "setuptools-rust>=1.13.0,<2", "build>=1.6.1"]

[project.scripts]
workbook-forge = "workbook_forge.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.data-files]
"share/workbook_forge/catalog" = [
  "catalog/formulas.json",
  "catalog/open_source_patterns.json",
  "catalog/open-source-patterns.schema.json",
  "catalog/function-inventory.schema.json",
  "catalog/formula-support.schema.json",
  "catalog/function_inventory.json",
  "catalog/workbook-capabilities.json",
  "catalog/dependency-licenses.json",
  "catalog/agent-operations.json",
  "catalog/extraction-patterns.json",
  "catalog/extraction-report.schema.json",
]

[tool.setuptools.packages.find]
where = ["python"]
# Ship only the library. Namespace discovery would also package python/tests.
include = ["workbook_forge*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]

[tool.ruff]
line-length = 100
target-version = "py312"
