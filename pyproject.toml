[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "workbook_forge"
version = "0.2.0"
description = "Agent-ready Excel SDK with an independent Python workbook engine"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.txt"]
dependencies = []

[project.optional-dependencies]
# ruff stays on 0.16.9. A newer release can change results even with the same
# selected rules, and 0.17.0 is not the gate.
test = ["pytest>=9.1.1", "jsonschema>=4.26.0", "packaging>=26.3", "setuptools>=84.0.0", "setuptools-rust>=1.13.0,<2", "build>=1.6.1", "ruff==0.16.9"]

[project.scripts]
workbook-forge = "workbook_forge.cli:main"
workbook-forge-compile = "workbook_forge.source_cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.data-files]
"share/workbook_forge/catalog" = [
  "catalog/formulas.json",
  "catalog/open_source_patterns.json",
  "catalog/open-source-patterns.schema.json",
  "catalog/function-inventory.schema.json",
  "catalog/formula-support.schema.json",
  "catalog/function_inventory.json",
  "catalog/workbook-capabilities.json",
  "catalog/dependency-licenses.json",
  "catalog/agent-operations.json",
  "catalog/extraction-patterns.json",
  "catalog/extraction-report.schema.json",
  "catalog/primitive-catalog.json",
  "catalog/primitive-expression.schema.json",
]

[tool.setuptools.packages.find]
where = ["python"]
# Ship only the library. Namespace discovery would also package python/tests.
include = ["workbook_forge*"]
namespaces = false

[tool.setuptools.package-data]
workbook_forge = ["source_runtime_v2.rs", "source_runtime_v3.rs", "source_runtime_v4.rs", "source_runtime_v5.rs"]

# The wheel targets the stable ABI so one build serves every CPython from 3.12 on.
[tool.distutils.bdist_wheel]
py_limited_api = "cp312"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
pythonpath = ["python"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# The rule set is stated so a new ruff release cannot change what the gate checks.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# This module imports pytest fixtures from sibling test modules. Pytest
# resolves them by name, which ruff reads as unused imports and redefinitions.
"python/tests/test_review_boundaries.py" = ["F401", "F811"]
