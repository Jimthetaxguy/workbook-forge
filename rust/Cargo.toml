[package]
name = "workbook_forge"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Typed workbook models and bounded Excel-compatible formula calculation"
repository = "https://github.com/Jimthetaxguy/workbook-forge"
readme = "../README.md"
license-file = "../LICENSE"

[lib]
name = "workbook_forge"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
