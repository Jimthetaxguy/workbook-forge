[package]
name = "workbook_forge_python"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Python bindings for Workbook Forge's native workbook engine"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
workbook_forge = { path = "../rust" }
pyo3 = { version = "=0.29.0", features = ["extension-module", "abi3-py312"] }
serde = "1"
serde_json = "1"
