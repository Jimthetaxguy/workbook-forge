[package]
name = "workbook_forge_python"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Python bindings for Workbook Forge's native workbook engine"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
workbook_forge = { path = "../rust" }
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py312"] }
serde = "1.0.229"
# float_roundtrip: without it a number in a document can be read one or two
# binary64 values off.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
